server {
    listen 80;
    listen [::]:80;
    server_name api-hakiki.aimsoftwares.com;

    # Force redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-hakiki.aimsoftwares.com;

    # Recommended Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Max body size (e.g. for image uploads)
    client_max_body_size 10M;

    location / {
        # Forward requests to your docker container on port 8082
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        # Headers to maintain request origin details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (hygiene / live updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Prevent API connection timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
